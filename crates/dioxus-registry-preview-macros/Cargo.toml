[package]
name = "dioxus-registry-preview-macros"
version.workspace = true
description = "Implementation macros re-exported by dioxus-registry-preview"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[features]
default = []
# Highlights Example sources with tree-sitter at expansion time. Enabled through the facade's
# `syntax-highlighting` feature; never enable it directly.
syntax-highlighting = ["dep:arborium", "dep:arborium-theme"]

[dependencies]
dioxus-registry-preview-core = { workspace = true }

arborium = { version = "2.16.0", default-features = false, features = ["lang-rust"], optional = true }
arborium-theme = { version = "2.16.0", optional = true }
proc-macro-crate = "3.0.0"
proc-macro2 = "1.0.101"
quote = "1.0.36"
syn = "3.0.3"

[lints]
workspace = true
