version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
    exclude-paths:
      - .github/workflows/dagger.yaml

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: daily
